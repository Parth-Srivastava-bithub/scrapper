services:
  scraper:
    image: gpu-scraper-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu_scraper_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - MONGODB_URI=${MONGODB_URI}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-gpu_aggregator}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - NOVITA_API_KEY=${NOVITA_API_KEY:-}
      - VASTAI_API_KEY=${VASTAI_API_KEY:-}
      - PYTHONUNBUFFERED=1
