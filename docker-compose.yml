services:
  scraper:
    image: yellowforest/gpu-scraper-worker:latest
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gpu_scraper_worker
    restart: unless-stopped
    env_file:
      - path: .env
        required: false
    environment:
      - MONGODB_URI=${MONGODB_URI:-mongodb://localhost:27017/}
      - MONGODB_DB_NAME=${MONGODB_DB_NAME:-gpu_aggregator}
      - RUNPOD_API_KEY=${RUNPOD_API_KEY:-}
      - NOVITA_API_KEY=${NOVITA_API_KEY:-}
      - VASTAI_API_KEY=${VASTAI_API_KEY:-}
      - CDP_PORT=${CDP_PORT:-9222}
      - CHROME_HEADLESS=${CHROME_HEADLESS:-new}
      - CHROME_USER_DATA_DIR=${CHROME_USER_DATA_DIR:-/data/chrome-profile}
      - PYTHONUNBUFFERED=1
    volumes:
      # Persistent named volume for the Chrome session profile
      - scraper_chrome_profile:/data/chrome-profile
      # Alternatively, to bind-mount a host folder, comment above and uncomment below:
      # - ./chrome-profile:/data/chrome-profile
    shm_size: "2gb" # Chromium needs sufficient shared memory for page rendering

volumes:
  scraper_chrome_profile:
    driver: local
